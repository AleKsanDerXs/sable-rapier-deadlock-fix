modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
    modId = "sable_rapier_deadlock_fix"
    version = "1.0.0"
    displayName = "Sable Rapier Physics Deadlock Fix"
    authors = "AleKsanDerXs"
    description = '''
        Fixes a dedicated-server hang/deadlock in Sable 2.0.3's Rapier physics
        backend: RapierPhysicsPipeline.physicsTick() can reenter the native
        Rapier engine via handleBlockChange() -> Rapier3D.newVoxelCollider()
        while already inside Rapier3D.step() (e.g. when a fragile block is
        destroyed by a physics collision mid-step), which hangs the native
        call forever and eventually trips ServerHangWatchdog.
    '''

[[mixins]]
    config = "sable_rapier_deadlock_fix.mixins.json"

[[dependencies.sable_rapier_deadlock_fix]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.sable_rapier_deadlock_fix]]
    modId = "sable"
    type = "required"
    versionRange = "[2.0.3,2.0.4)"
    ordering = "AFTER"
    side = "BOTH"
